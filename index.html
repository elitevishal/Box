
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1">

<title>Camera</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

#camera {
    width: 100%;
    height: 100%;
    height: 100dvh;
    object-fit: cover;
    display: none;
    background: #000;
}

#permission {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    color: #fff;
    padding: 24px;
    text-align: center;
}

#permission button {
    border: 0;
    border-radius: 10px;
    padding: 15px 25px;
    background: #fff;
    color: #000;
    font-size: 16px;
    font-weight: 600;
}

#permission p {
    margin-bottom: 20px;
    color: #aaa;
    font-size: 14px;
}

#liveStatus {
    display: none;
    position: fixed;
    top: 14px;
    left: 14px;
    padding: 8px 12px;
    background: rgba(0,0,0,.65);
    color: white;
    border-radius: 20px;
    font-size: 12px;
}
</style>
</head>

<body>

<div id="permission">
    <div>
        <p>Camera access is required to start the live preview.</p>
        <button id="allowCamera">Allow Camera</button>
    </div>
</div>

<video id="camera"
       autoplay
       playsinline
       muted></video>

<div id="liveStatus">● Camera is active</div>

<script>
const camera = document.getElementById("camera");
const permission = document.getElementById("permission");
const allowCamera = document.getElementById("allowCamera");
const liveStatus = document.getElementById("liveStatus");

let activeStream = null;

async function startCamera() {
    try {
        if (!navigator.mediaDevices?.getUserMedia) {
            throw new Error("HTTPS connection is required.");
        }

        activeStream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "user",
                width: { ideal: 1920 },
                height: { ideal: 1080 }
            },
            audio: false
        });

        camera.srcObject = activeStream;
        await camera.play();

        permission.style.display = "none";
        camera.style.display = "block";
        liveStatus.style.display = "block";

    } catch (error) {
        permission.style.display = "flex";
        permission.querySelector("p").textContent =
            "Camera unavailable. Please check browser permissions and try again.";
    }
}

allowCamera.addEventListener("click", startCamera);

document.addEventListener("visibilitychange", () => {
    if (document.hidden && activeStream) {
        activeStream.getTracks().forEach(track => track.stop());
        activeStream = null;
        camera.srcObject = null;
        camera.style.display = "none";
        liveStatus.style.display = "none";
        permission.style.display = "flex";
        permission.querySelector("p").textContent =
            "Camera stopped. Tap Allow Camera to restart.";
    }
});
</script>

</body>
</html>
