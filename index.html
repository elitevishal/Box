
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Media Viewer</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080b12;
    color: white;
    font-family: Arial, sans-serif;
}

.viewer {
    width: 100%;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    position: relative;
    background: #080b12;
}

.header {
    height: 55px;
    flex-shrink: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 16px;
    background: #111827;
    border-bottom: 1px solid #263449;
}

.brand {
    font-size: 15px;
    font-weight: 700;
}

.status {
    font-size: 12px;
    color: #fbbf24;
}

.camera-area {
    flex: 1;
    min-height: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    background: #020617;
}

video, canvas, #captured {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

video {
    display: none;
}

#captured {
    display: none;
}

.placeholder {
    position: absolute;
    text-align: center;
    padding: 25px;
    color: #94a3b8;
}

.placeholder .symbol {
    font-size: 55px;
    margin-bottom: 15px;
}

.controls {
    flex-shrink: 0;
    padding: 16px;
    background: #111827;
    border-top: 1px solid #263449;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: #0284c7;
    color: white;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 9px;
}

button:disabled {
    opacity: .4;
}

.secondary {
    background: #263449;
}

#message {
    text-align: center;
    color: #94a3b8;
    font-size: 12px;
    margin-top: 5px;
}

#photoCount {
    color: #38bdf8;
    font-size: 12px;
    text-align: center;
    margin-bottom: 10px;
}
</style>
</head>

<body>

<div class="viewer">

    <header class="header">
        <div class="brand">🖼️ Media Viewer</div>
        <div class="status" id="status">● Ready</div>
    </header>

    <main class="camera-area">

        <div class="placeholder" id="placeholder">
            <div class="symbol">📷</div>
            <h3>Camera Preview</h3>
            <p style="margin-top:10px">
                Allow camera access to start your preview.
            </p>
        </div>

        <video id="video"
               autoplay
               playsinline
               muted></video>

        <img id="captured" alt="Captured photo">

        <canvas id="canvas" hidden></canvas>

    </main>

    <footer class="controls">

        <div id="photoCount">No photo captured</div>

        <button id="start">
            📷 Allow Camera & Start
        </button>

        <button id="capture" disabled>
            Capture Photo
        </button>

        <button id="download" class="secondary" disabled>
            Download Photo
        </button>

        <button id="stop" class="secondary" disabled>
            Stop Camera
        </button>

        <div id="message">
            Camera access is controlled by you.
        </div>

    </footer>

</div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const captured = document.getElementById("captured");

const startBtn = document.getElementById("start");
const captureBtn = document.getElementById("capture");
const downloadBtn = document.getElementById("download");
const stopBtn = document.getElementById("stop");

const status = document.getElementById("status");
const message = document.getElementById("message");
const placeholder = document.getElementById("placeholder");
const photoCount = document.getElementById("photoCount");

let stream = null;
let photoBlob = null;

async function startCamera() {

    if (!navigator.mediaDevices?.getUserMedia) {
        message.textContent =
            "Camera requires HTTPS or localhost.";
        return;
    }

    try {
        message.textContent = "Requesting camera permission...";

        stream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
                facingMode: "user",
                width: { ideal: 1920 },
                height: { ideal: 1080 }
            }
        });

        video.srcObject = stream;
        await video.play();

        video.style.display = "block";
        captured.style.display = "none";
        placeholder.style.display = "none";

        startBtn.disabled = true;
        captureBtn.disabled = false;
        stopBtn.disabled = false;
        downloadBtn.disabled = true;

        status.textContent = "● Camera Active";
        status.style.color = "#4ade80";

        message.textContent =
            "Camera is active. Capture when ready.";

    } catch (error) {

        status.textContent = "● Camera Unavailable";
        status.style.color = "#f87171";

        message.textContent =
            error.name + ": " + error.message;
    }
}

function capturePhoto() {

    if (!stream || !video.videoWidth) {
        message.textContent = "Camera is not ready.";
        return;
    }

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const ctx = canvas.getContext("2d");

    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    canvas.toBlob(blob => {

        if (!blob) {
            message.textContent = "Capture failed.";
            return;
        }

        photoBlob = blob;

        captured.src = URL.createObjectURL(blob);
        captured.style.display = "block";
        video.style.display = "none";

        downloadBtn.disabled = false;

        photoCount.textContent =
            canvas.width + " × " + canvas.height;

        message.textContent =
            "Photo captured successfully.";

    }, "image/jpeg", 0.95);
}

function downloadPhoto() {

    if (!photoBlob) return;

    const url = URL.createObjectURL(photoBlob);

    const link = document.createElement("a");
    link.href = url;
    link.download = "media-photo.jpg";
    link.click();

    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function stopCamera() {

    if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
    }

    video.srcObject = null;
    video.style.display = "none";
    captured.style.display = "none";
    placeholder.style.display = "block";

    startBtn.disabled = false;
    captureBtn.disabled = true;
    stopBtn.disabled = true;

    status.textContent = "● Camera Stopped";
    status.style.color = "#fbbf24";

    message.textContent = "Camera stopped.";
}

startBtn.addEventListener("click", startCamera);
captureBtn.addEventListener("click", capturePhoto);
downloadBtn.addEventListener("click", downloadPhoto);
stopBtn.addEventListener("click", stopCamera);
</script>

</body>
</html>
